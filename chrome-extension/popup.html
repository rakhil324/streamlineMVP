<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #1f2937;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #2563eb;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }
    .info-text {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.4;
    }
    a {
      color: #3b82f6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Streamline AI Autofill</h2>
  
  <div class="section">
    <button id="testBtn">Test Connection</button>
    <div id="status"></div>
  </div>
  
  <div class="info-text" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb;">
    <strong>How to use:</strong><br>
    1. Make sure you've uploaded a resume in your profile<br>
    2. Go to a Greenhouse job application page<br>
    3. Click the "Autofill" button that appears on the page<br>
    4. Fields will be automatically filled with your profile data
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
